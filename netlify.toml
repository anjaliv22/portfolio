# Netlify settings. Only the site/ folder is published; mockup/ drafts stay private.
[build]
  publish = "site"
  command = ""

# The professional page is the homepage. Old /pro links go there; /garden opens Fun mode.
[[redirects]]
  from = "/pro"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/pro.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/garden"
  to = "/garden.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"
